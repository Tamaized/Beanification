import net.neoforged.moddevgradle.dsl.ModModel

plugins {
	id 'java-gradle-plugin'
	id 'groovy'
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	// Version List: https://projects.neoforged.net/neoforged/ModDevGradle
	id 'net.neoforged.moddev' version "${mdg_version}"
	id "com.dorongold.task-tree" version "4.0.0"
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
	secretsFile.withInputStream {
		stream -> secrets.load(stream)
	}

	fileTree("secrets").matching {
		include "**/*.properties"
	}.each {
		File file ->
			file.withInputStream {
				stream -> secrets.load(stream)
			}
	}
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

version = "${project.mod_major_version}." + (hasProperty("CIVersion") ? CIVersion : mod_version)
group = group_name

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
}

compileJava.options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-this-escape" << "-Werror"

base {
	archivesName = "${project.mod_id}"
}

sourceSets {
	gradle {

	}

	main {
		resources {
			srcDir 'src/generated/resources'
		}
	}

	integrationTest {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}

}

configurations {
	integrationTestImplementation.extendsFrom implementation
}

neoForge {
	version = project.neo_version

	validateAccessTransformers = true

	addModdingDependenciesTo sourceSets.integrationTest

	mods {
		create("${this.project.mod_id}") { ModModel model ->
			model.sourceSet this.sourceSets.main
		}
		create("${this.project.mod_id}-integration-test") { ModModel model ->
			model.sourceSet this.sourceSets.integrationTest
		}
	}

	def mainMod = mods."${this.project.mod_id}"
	def integrationTestMod = mods."${this.project.mod_id}-integration-test"

	unitTest {
		enable()
		testedMod = mainMod
		loadedMods = [mainMod]
	}

	runs {
		configureEach {
			gameDirectory = project.file('run')
			loadedMods = [mainMod]
			systemProperty 'forge.logging.console.level', 'debug'
			logLevel = org.slf4j.event.Level.DEBUG
		}

		create('client') {
			client()
			loadedMods = [mainMod, integrationTestMod]
			systemProperty 'forge.enabledGameTestNamespaces', this.project.mod_id
			programArguments.addAll '--username', secrets.getProperty("username") ?: 'Dev', secrets.getProperty("uuid") ? '--uuid' : '', secrets.getProperty("uuid") ?: ''
		}

		create('server') {
			server()
			systemProperty 'forge.enabledGameTestNamespaces', this.project.mod_id
			programArgument '--nogui'
		}

		create('data') {
			clientData()
			gameDirectory = project.file('run-data')
			programArguments.addAll '--mod', this.project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}
}

repositories {
	gradlePluginPortal()
	mavenLocal()
	maven {
		name 'Jared\'s Maven' // JEI
		url 'https://maven.blamejared.com/'
	}
}

dependencies {
	// implementation "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"

	testImplementation group: 'net.neoforged', name: 'testframework', version: project.neo_version
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '6.0.1'
	testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '6.0.1'
	testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.0.1'
	testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '5.21.0'

	gradleImplementation(gradleApi())
	gradleImplementation(localGroovy())
	gradleImplementation "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:${project.mdg_version}"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"

		showExceptions true
		exceptionFormat "full"
		showCauses true
		showStackTraces true

		showStandardStreams = false
	}
}

jar {
	exclude 'META-INF/neoforge.mods.toml'
	manifest {
		attributes([
			'FMLModType'              : 'GAMELIBRARY',
			'Specification-Title'     : mod_id,
			'Specification-Vendor'    : "Tamaized",
			'Specification-Version'   : "1",
			'Implementation-Title'    : this.project.name,
			'Implementation-Version'  : this.project.jar.archiveVersion,
			'Implementation-Vendor'   : "Tamaized",
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

def mavenUser = hasProperty("CIMUser") ? CIMUser : secrets.getProperty("maven_username")
def mavenToken = hasProperty("CIMToken") ? CIMToken : secrets.getProperty("maven_password")

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			afterEvaluate {
				artifact this.project.jar
				artifact this.project.sourceJar
				artifact this.project.testJar
				artifact this.project.testSourceJar
				artifact this.project.gradlePluginJar
			}
			groupId 'tamaized'
			artifactId this.project.mod_id
		}
	}
	repositories {
		maven {
			url "https://maven.tamaized.com/releases"
			credentials {
				username mavenUser
				password mavenToken
			}
		}
	}
}

tasks.register('sourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
}

tasks.register('testJar', Jar) {
	dependsOn 'classes'
	from sourceSets.test.output
	archiveClassifier = 'tests'
}

tasks.register('testSourceJar', Jar) {
	dependsOn 'classes'
	from sourceSets.test.allSource
	archiveClassifier = 'test-sources'
}

tasks.register('gradlePluginJar', Jar) {
	dependsOn 'classes'
	from sourceSets.gradle.output
	archiveClassifier = 'gradle'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
